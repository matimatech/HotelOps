[project]
name = "hotelops"
version = "0.2.0"
description = "Pembanding harga hotel lintas Agoda, Traveloka, dan Tiket"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.1",
    "pandas>=3.0.1",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67.3",
    "dbt-duckdb>=1.11,<1.12",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1.6",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
]

[project.scripts]
hotelops = "hotelops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hotelops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
